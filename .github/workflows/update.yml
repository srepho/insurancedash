# Daily update: ingest -> archive raw files -> commit data -> build -> deploy to GitHub Pages.
#
# Deploys only when the build fingerprint (data + status + site/code) differs from the one
# published by the LAST SUCCESSFUL DEPLOY (fetched from the live site's /fingerprint.txt).
# A failed deploy therefore leaves the old fingerprint live and is retried on the next run.
name: update

on:
  schedule:
    - cron: "30 21 * * *" # 07:30 AEST / 08:30 AEDT
  workflow_dispatch:
    inputs:
      force_deploy:
        description: "Build and deploy even if the fingerprint matches"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.compare.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tags upstream
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install Python deps
        run: uv sync --frozen

      - name: Lint and test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q
          npm test --prefix site

      - name: Ingest all sources (staging -> validate -> promote)
        run: uv run python -m ingest.run

      - name: Archive new raw source files as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(data/raw/*/*)
          if [ ${#files[@]} -eq 0 ]; then echo "Nothing to archive."; exit 0; fi
          gh release view raw-archive >/dev/null 2>&1 || \
            gh release create raw-archive --title "Raw source archive" \
              --notes "Raw source files keyed by vintage_id (<source>__<vintage>__<file>). Not a software release."
          existing=$(gh release view raw-archive --json assets -q '.assets[].name')
          for f in "${files[@]}"; do
            src=$(basename "$(dirname "$f")")
            name="${src}__$(basename "$f")"
            if grep -qxF "$name" <<<"$existing"; then continue; fi
            cp "$f" "/tmp/$name"
            gh release upload raw-archive "/tmp/$name"
          done

      - name: Commit data and status changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/parquet data/status.json
          if git diff --cached --quiet; then
            echo "No data or status change."
          else
            git commit -m "data: update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Compare with last successful deploy
        id: compare
        run: |
          fp=$(uv run python -m ingest.fingerprint)
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/fingerprint.txt"
          deployed=$(curl -fsSL "$url" 2>/dev/null | tr -d '[:space:]' || true)
          echo "build fingerprint:    $fp"
          echo "deployed fingerprint: ${deployed:-<none>}"
          if [ "$fp" = "$deployed" ] && [ "${{ inputs.force_deploy }}" != "true" ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Block publication if a required source is invalid
        if: steps.compare.outputs.deploy == 'true'
        run: uv run python -m ingest.run --check-publishable

      - name: Build site
        if: steps.compare.outputs.deploy == 'true'
        working-directory: site
        run: |
          npm ci
          npm run build # invalidates cached loaders when their inputs change; writes dist/fingerprint.txt

      - uses: actions/upload-pages-artifact@v5
        if: steps.compare.outputs.deploy == 'true'
        with:
          path: site/dist

  deploy:
    needs: update
    if: needs.update.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
