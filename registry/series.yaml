# Series registry. One entry per series_id (measure + all dimensions).
# See PLAN.md > Data model. Validated by ingest/registry.py.
sources:
  rba:
    name: Reserve Bank of Australia — statistical tables
    landing_url: https://www.rba.gov.au/statistics/tables/
    licence: CC BY 4.0 (RBA-sourced series only; ASX/FENICS columns excluded)
    required: true
    overdue_after_days: 10
    table: observations
  apra:
    name: APRA — Quarterly General Insurance Performance Statistics
    landing_url: https://www.apra.gov.au/quarterly-general-insurance-performance-statistics
    licence: CC BY 3.0 AU
    required: true
    overdue_after_days: 170
    table: observations
  jsa_ivi:
    name: Jobs and Skills Australia — Internet Vacancy Index
    landing_url: https://www.jobsandskills.gov.au/data/internet-vacancy-index
    licence: CC BY 4.0
    required: true
    overdue_after_days: 60
    table: observations
  jsa_exposure:
    name: Jobs and Skills Australia — Gen AI Capacity Study occupation data
    landing_url: https://www.jobsandskills.gov.au/studies/generative-artificial-intelligence-capacity-study
    licence: CC BY 4.0
    required: false
    overdue_after_days: null
    table: exposure_scores
