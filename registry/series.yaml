- series_id: jsa.ivi.ads_3mma.total.aust.orig
  source: jsa_ivi
  title: Online job ads — All occupations (published total)
  source_key:
    anzsco_code: '0'
    state: AUST
  dimensions:
    occupation: All occupations (published total)
    anzsco_code: '0'
    classification_version: ANZSCO v1.2 (inferred from titles)
    region: AUST
  unit: job ads
  frequency: monthly
  adjustment: original
  definition: Count of new online job advertisements (SEEK, CareerOne, Workforce Australia) coded to the ANZSCO
    unit group, as a 3-month moving average ending in the reference month.
  measure_basis:
    period: 3-month moving average ending in reference month
    aggregation: do not sum unit groups; 3mma unit groups do not add to the published total
  transformation:
    type: moving_average
    window_months: 3
    applied_by: JSA
  source_url: https://www.jobsandskills.gov.au/data/internet-vacancy-index
  release_cadence: monthly, third Wednesday
  breaks: []
