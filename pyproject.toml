[project]
name = "insurancedash"
version = "0.1.0"
requires-python = ">=3.12"
description = "Australian economy, insurance and AI-jobs dashboard built from public data"
license = "MIT"
readme = "README.md"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://srepho.github.io/insurancedash/"
Repository = "https://github.com/srepho/insurancedash"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# fixtures and tests embed verbatim source-file lines and link text
"tests/**" = ["E501"]
